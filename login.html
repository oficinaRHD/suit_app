</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>

</button>
</div>
</div>

<span>Iniciar Sesión</span>

<script>

              // Autocompletar email desde URL (para cuando venimos del lobby)
        const params = new URLSearchParams(window.location.search);
        const emailParam = params.get('email');
        if (emailParam) {
            document.getElementById('email').value = emailParam;
        }
      
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Add a slight tilt effect to the card on mouse move for desktop
        const card = document.querySelector('section');
        if (window.innerWidth > 1024) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        }

        // ========== LOGIN ==========
        const loginForm = document.getElementById('loginForm');
        const loginErrorEl = document.getElementById('login-error');
        const loginInfoEl = document.getElementById('login-info');
        const loginSubmitBtn = document.getElementById('login-submit-btn');

        function showLoginError(message) {
            loginErrorEl.textContent = message;
            loginErrorEl.classList.remove('hidden');
        }

        function hideLoginError() {
            loginErrorEl.classList.add('hidden');
        }

        function showLoginInfo(message) {
            loginInfoEl.textContent = message;
            loginInfoEl.classList.remove('hidden');
        }

        // Si venimos de un registro con confirmación de correo pendiente
        (function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('registered') === '1') {
                showLoginInfo('Cuenta creada. Revisa tu correo para confirmar tu cuenta antes de iniciar sesión (si tu proyecto lo requiere).');
            }
        })();

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideLoginError();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showLoginError('Ingresa tu correo y contraseña.');
                return;
            }

            loginSubmitBtn.disabled = true;

            try {
                const { error: signInError } = await window.suitSupabase.auth.signInWithPassword({
                    email,
                    password
                });

                   // Dentro del bloque try después de signInWithPassword
                const { data: { session } } = await window.suitSupabase.auth.getSession();               

                if (signInError) throw signInError;

                // Obtener el perfil (incluye el rol) vía RPC
                const { data: profileRows, error: profileError } = await window.suitSupabase.rpc('get_my_profile');
                if (profileError) throw profileError;

                const profile = Array.isArray(profileRows) ? profileRows[0] : profileRows;
                if (!profile) {
                    throw new Error('No se encontró un perfil asociado a esta cuenta.');
                }

                // Persistir sesión local para la lógica offline-first (index.html)
                await suitPersistSession(profile, session);

                suitRedirectToDashboard(profile.role);

            } catch (error) {
                console.error('[Login] Error:', error);

                let message = error.message || 'No se pudo iniciar sesión. Intenta nuevamente.';
                if (message.includes('Invalid login credentials')) {
                    message = 'Correo o contraseña incorrectos.';
                } else if (message.includes('Email not confirmed')) {
                    message = 'Debes confirmar tu correo antes de iniciar sesión.';
                }

                showLoginError(message);
                loginSubmitBtn.disabled = false;
            }
        });

        // ========== LOGIN CON GOOGLE (OAuth) ==========
        const googleBtn = document.getElementById('google-login-btn');
        const OAUTH_FLAG = 'suit_oauth_pending';

        function setAuthBusy(busy) {
            googleBtn.disabled = busy;
            loginSubmitBtn.disabled = busy;
        }

        // Completa el login (perfil + sesión local + redirección) con la sesión ya activa
        async function completeLoginFromSession() {
            const { data: { session }, error: sessionError } = await window.suitSupabase.auth.getSession();
            if (sessionError) throw sessionError;
            if (!session) return false;

            const { data: profileRows, error: profileError } = await window.suitSupabase.rpc('get_my_profile');
            if (profileError) throw profileError;

            const profile = Array.isArray(profileRows) ? profileRows[0] : profileRows;
            if (!profile) {
                // Sesión de Google válida pero sin perfil en Suit: no dejar sesión huérfana
                await window.suitSupabase.auth.signOut();
                throw new Error('Esta cuenta de Google no tiene un perfil en Suit. Regístrate primero o usa otro método.');
            }

            await suitPersistSession(profile, session);
            suitRedirectToDashboard(profile.role);
            return true;
        }

        googleBtn.addEventListener('click', async function () {
            hideLoginError();

            if (!navigator.onLine) {
                showLoginError('Sin conexión. Necesitas internet para iniciar sesión con Google.');
                return;
            }

            setAuthBusy(true);
            try {
                try { sessionStorage.setItem(OAUTH_FLAG, '1'); } catch (_) {}

                // Debe estar registrada en Supabase → Authentication → URL Configuration → Redirect URLs
                const redirectTo = window.location.origin + window.location.pathname;

                const { error } = await window.suitSupabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo,
                        queryParams: { prompt: 'select_account' }
                    }
                });
                if (error) throw error;
                // En éxito el navegador redirige a Google; no se reactivan los botones.
            } catch (error) {
                console.error('[Login Google] Error:', error);
                try { sessionStorage.removeItem(OAUTH_FLAG); } catch (_) {}
                showLoginError(error.message || 'No se pudo iniciar sesión con Google. Intenta nuevamente.');
                setAuthBusy(false);
            }
        });

        // Al volver de Google: procesar errores o completar el login
        (async function handleOAuthReturn() {
            let pending = false;
            try { pending = sessionStorage.getItem(OAUTH_FLAG) === '1'; } catch (_) {}
            if (!pending) return;

            try { sessionStorage.removeItem(OAUTH_FLAG); } catch (_) {}

            const query = new URLSearchParams(window.location.search);
            const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            const oauthError = query.get('error_description') || hash.get('error_description') || query.get('error') || hash.get('error');

            if (oauthError) {
                showLoginError(
                    oauthError.toLowerCase().includes('access_denied')
                        ? 'Cancelaste el inicio de sesión con Google.'
                        : 'Error con Google: ' + oauthError.replace(/\+/g, ' ')
                );
                history.replaceState(null, '', window.location.pathname);
                return;
            }

            setAuthBusy(true);
            try {
                // getSession espera a que supabase-js procese el code/token de la URL
                const ok = await completeLoginFromSession();
                if (!ok) {
                    showLoginError('No se pudo completar el inicio de sesión con Google. Intenta nuevamente.');
                    setAuthBusy(false);
                }
            } catch (error) {
                console.error('[Login Google] Error al completar sesión:', error);
                showLoginError(error.message || 'No se pudo completar el inicio de sesión con Google.');
                setAuthBusy(false);
            } finally {
                history.replaceState(null, '', window.location.pathname);
            }
        })();

        // Si el usuario vuelve con "atrás" desde Google (bfcache), reactivar los botones
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) setAuthBusy(false);
        });
    </script>
