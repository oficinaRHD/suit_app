  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface min-h-screen flex items-center justify-center p-gutter">
  <main class="w-full max-w-[480px] flex flex-col gap-stack-lg">
    <div class="text-center space-y-base">
      <h1 class="font-headline-md text-headline-md text-primary font-black tracking-tight">Suit</h1>
      <p class="font-body-md text-body-md text-on-surface-variant">Elige una nueva contraseña</p>
    </div>

    <section class="bg-surface-container-lowest border border-outline-variant p-stack-lg rounded-lg login-card-shadow">
      <form class="flex flex-col gap-stack-md" id="updatePasswordForm">
        <div class="hidden p-3 rounded-lg bg-error-container text-on-error-container text-body-sm font-body-sm" id="update-error"></div>
        <div class="hidden p-3 rounded-lg bg-secondary-container text-on-secondary-container text-body-sm font-body-sm" id="update-success"></div>

        <!-- Nueva contraseña -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-on-surface-variant uppercase" for="new-password">Nueva Contraseña</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
            <input class="w-full pl-10 pr-12 py-3 bg-transparent border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-all outline-none" id="new-password" name="new-password" placeholder="••••••••" required type="password" />
            <button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface p-1" onclick="togglePassword('new-password', 'eyeIconNew')" type="button">
              <span class="material-symbols-outlined" id="eyeIconNew">visibility</span>
            </button>
          </div>
        </div>

        <!-- Confirmar contraseña -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-on-surface-variant uppercase" for="confirm-password">Confirmar Contraseña</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
            <input class="w-full pl-10 pr-12 py-3 bg-transparent border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-all outline-none" id="confirm-password" name="confirm-password" placeholder="••••••••" required type="password" />
            <button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface p-1" onclick="togglePassword('confirm-password', 'eyeIconConfirm')" type="button">
              <span class="material-symbols-outlined" id="eyeIconConfirm">visibility</span>
            </button>
          </div>
        </div>

        <button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-title-sm text-title-sm py-3 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2 group disabled:opacity-60 disabled:cursor-not-allowed" id="update-submit-btn" type="submit">
          <span>Actualizar Contraseña</span>
          <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">check</span>
        </button>
      </form>

      <div class="mt-stack-lg text-center">
        <a class="text-primary hover:underline font-body-sm" href="login.html">
          <span class="material-symbols-outlined text-sm">arrow_back</span> Volver a Iniciar Sesión
        </a>
      </div>
    </section>

    <footer class="mt-auto py-stack-md flex flex-col items-center gap-base">
      <div class="flex gap-stack-md">
        <a class="font-body-sm text-body-sm text-outline hover:text-primary transition-colors" href="terms-policy.html">Términos y Privacidad</a>
      </div>
    </footer>
  </main>

  <div class="hidden lg:block fixed -bottom-24 -right-24 w-96 h-96 bg-primary-fixed opacity-20 blur-[100px] rounded-full pointer-events-none"></div>
  <div class="hidden lg:block fixed -top-24 -left-24 w-64 h-64 bg-tertiary-fixed opacity-20 blur-[80px] rounded-full pointer-events-none"></div>

  <script src="supabase-client.js"></script>
  <script>
    // ====== UPDATE PASSWORD ======
    const updateForm = document.getElementById('updatePasswordForm');
    const updateError = document.getElementById('update-error');
    const updateSuccess = document.getElementById('update-success');
    const updateSubmitBtn = document.getElementById('update-submit-btn');

    function showUpdateError(msg) {
      updateError.textContent = msg;
      updateError.classList.remove('hidden');
      updateSuccess.classList.add('hidden');
    }

    function showUpdateSuccess(msg) {
      updateSuccess.textContent = msg;
      updateSuccess.classList.remove('hidden');
      updateError.classList.add('hidden');
    }

    function hideMessages() {
      updateError.classList.add('hidden');
      updateSuccess.classList.add('hidden');
    }

    // Toggle password visibility
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    // Función para extraer el access_token del hash de la URL
    function getHashParam(key) {
      const hash = window.location.hash.substring(1); // quita el #
      const params = new URLSearchParams(hash);
      return params.get(key);
    }

    // Al cargar la página, intentamos establecer la sesión automáticamente si hay token en el hash
    (async function handleRecoveryToken() {
      const accessToken = getHashParam('access_token');
      const refreshToken = getHashParam('refresh_token');
      const type = getHashParam('type'); // podría ser 'recovery'

      if (accessToken && refreshToken) {
        try {
          // Establecemos la sesión con los tokens del hash
          const { error } = await window.suitSupabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) throw error;
          console.log('Sesión de recuperación establecida correctamente.');
        } catch (err) {
          console.error('Error al establecer sesión desde el hash:', err);
          showUpdateError('El enlace de recuperación no es válido o ha expirado. Solicita uno nuevo.');
        }
      } else {
        // Si no hay tokens, tal vez el usuario llegó manualmente a esta página
        showUpdateError('No se encontró un enlace de recuperación válido. Por favor, solicita un nuevo enlace desde la página de inicio de sesión.');
      }
    })();

    updateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword.length < 6) {
        showUpdateError('La contraseña debe tener al menos 6 caracteres.');
        return;
      }

      if (newPassword !== confirmPassword) {
        showUpdateError('Las contraseñas no coinciden.');
        return;
      }

      updateSubmitBtn.disabled = true;

      try {
        // Verificar si la sesión está activa (debería estarlo por el token)
        const { data: { session } } = await window.suitSupabase.auth.getSession();
        if (!session) {
          throw new Error('No tienes una sesión activa. El enlace de recuperación puede haber expirado.');
        }

        // Actualizar la contraseña del usuario autenticado
        const { error } = await window.suitSupabase.auth.updateUser({
          password: newPassword
        });

        if (error) throw error;

        showUpdateSuccess('¡Contraseña actualizada correctamente! Ahora puedes iniciar sesión con tu nueva contraseña.');
        // Opcional: limpiar campos
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
        // Redirigir al login después de unos segundos
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);
      } catch (err) {
        console.error('[Update Password]', err);
        let msg = err.message || 'Ocurrió un error al actualizar la contraseña. Intenta de nuevo.';
        showUpdateError(msg);
        updateSubmitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
