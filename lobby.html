<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Suit · Lobby</title>

    <!-- Dependencia FUNCIONAL (no estructural). Si falla, la vista sigue renderizando. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ============ RESET / BASE ============ */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            line-height: 1.5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        }
        h1, h2, p { margin: 0; }
        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer;
        }
        svg { display: block; max-width: 100%; }

        /* ============ VARIABLES ============ */
        :root {
            --primary: #2563eb;
            --surface: #f7f9fb;
            --on-surface: #1a1c1e;
            --on-surface-variant: #42474e;
            --outline-variant: #c2c7cf;
            --blue-100: #dbeafe;
        }

        /* ============ ANIMACIONES ============ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-600 { animation-delay: 0.6s; }
        .delay-700 { animation-delay: 0.7s; }

        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(37,99,235,0.3)); }
            50%      { filter: drop-shadow(0 0 20px rgba(37,99,235,0.6)); }
        }
        .glow-pulse { animation: glowPulse 2s ease-in-out infinite; }

        /* ============ LAYOUT ============ */
        .container   { width: 100%; }
        .max-w-3xl   { max-width: 48rem; }
        .mx-auto     { margin-left: auto; margin-right: auto; }
        .min-h-screen{ min-height: 100vh; }
        .flex        { display: flex; }
        .inline-flex { display: inline-flex; }
        .grid        { display: grid; }
        .flex-col    { flex-direction: column; }
        .flex-1      { flex: 1 1 0%; }
        .flex-wrap   { flex-wrap: wrap; }
        .items-center{ align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-center { justify-content: center; }
        .justify-between{ justify-content: space-between; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .hidden { display: none; }

        /* ============ TAMAÑOS ============ */
        .w-full { width: 100%; }
        .w-20   { width: 5rem; }
        .h-20   { height: 5rem; }
        .w-12   { width: 3rem; }
        .h-12   { height: 3rem; }

        /* ============ ESPACIADO ============ */
        .mt-1 { margin-top: 0.25rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mt-8 { margin-top: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .p-5  { padding: 1.25rem; }
        .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }

        /* ============ TIPOGRAFÍA ============ */
        .text-center { text-align: center; }
        .font-medium   { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .font-bold     { font-weight: 700; }
        .font-extrabold{ font-weight: 800; }
        .uppercase     { text-transform: uppercase; }
        .tracking-wider{ letter-spacing: 0.05em; }
        .tracking-tight{ letter-spacing: -0.025em; }

        .text-base { font-size: 1rem;     line-height: 1.5rem; }
        .text-sm   { font-size: 0.875rem; line-height: 1.25rem; }
        .text-lg   { font-size: 1.125rem; line-height: 1.75rem; }
        .text-xl   { font-size: 1.25rem;  line-height: 1.75rem; }
        .text-2xl  { font-size: 1.5rem;   line-height: 2rem; }
        .text-3xl  { font-size: 1.875rem; line-height: 2.25rem; }
        .text-\[10px\] { font-size: 10px; }
        .text-\[11px\] { font-size: 11px; }

        /* ============ COLORES ============ */
        .bg-surface   { background-color: var(--surface); }
        .bg-white     { background-color: #ffffff; }
        .bg-primary   { background-color: var(--primary); }
        .bg-primary\/10 { background-color: rgba(37, 99, 235, 0.10); }
        .bg-primary\/20 { background-color: rgba(37, 99, 235, 0.20); }
        .text-on-surface         { color: var(--on-surface); }
        .text-on-surface-variant { color: var(--on-surface-variant); }
        .text-primary { color: var(--primary); }
        .text-white   { color: #ffffff; }
        .text-blue-600{ color: #2563eb; }

        /* ============ BORDES / RADIOS / SOMBRAS ============ */
        .border { border-width: 1px; border-style: solid; border-color: var(--outline-variant); }
        .border-outline-variant { border-color: var(--outline-variant); }
        .border-blue-100 { border-color: var(--blue-100); }

        .rounded-xl   { border-radius: 0.75rem; }
        .rounded-2xl  { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }

        .shadow-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
        .shadow-md { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1),
                                0 2px 4px -2px rgb(0 0 0 / 0.1); }

        /* ============ TRANSICIONES / HOVER ============ */
        .transition-all {
            transition-property: color, background-color, border-color,
                                 box-shadow, transform, filter;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }
        .hover\:shadow-lg:hover {
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1),
                        0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .hover\:bg-surface:hover { background-color: var(--surface); }

        /* ============ FONDOS PROPIOS ============ */
        .banner-gradient {
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
        }

        /* ============ ICONOS SVG ============ */
        .icon { display: block; flex-shrink: 0; }
        .icon-xl  { width: 1.25rem;  height: 1.25rem; }
        .icon-3xl { width: 1.875rem; height: 1.875rem; }
        .icon-5xl { width: 3rem;     height: 3rem; }

        /* ============ RESPONSIVE ============ */
        @media (min-width: 640px) {
            .sm\:flex-row     { flex-direction: row; }
            .sm\:items-center { align-items: center; }
            .sm\:w-auto       { width: auto; }
            .sm\:flex-none    { flex: none; }
        }
        @media (min-width: 768px) {
            .md\:py-12      { padding-top: 3rem; padding-bottom: 3rem; }
            .md\:p-6        { padding: 1.5rem; }
            .md\:text-4xl   { font-size: 2.25rem; line-height: 2.5rem; }
            .md\:grid-cols-2{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .md\:w-auto     { width: auto; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">

    <main class="flex-1 container max-w-3xl mx-auto px-4 py-8 md:py-12 flex flex-col items-center justify-center">

        <!-- Logo + nombre -->
        <div class="text-center animate-fade-in-up">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-primary/10 text-primary glow-pulse">
                <!-- dashboard -->
                <svg class="icon icon-5xl" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                </svg>
            </div>
            <h1 class="mt-4 text-3xl md:text-4xl font-extrabold text-on-surface tracking-tight">
                Suit
            </h1>
            <p class="text-on-surface-variant text-base mt-1">Plataforma de gestión de vales</p>
        </div>

        <!-- Banner de cuenta guardada -->
        <div id="saved-account-banner" class="hidden w-full mt-8 banner-gradient rounded-2xl p-5 md:p-6 border border-blue-100 shadow-sm animate-fade-in-up delay-100">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center text-primary">
                        <!-- account_circle -->
                        <svg class="icon icon-3xl" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-on-surface-variant text-[10px] uppercase font-bold tracking-wider">Cuenta guardada</p>
                        <p id="saved-email" class="text-on-surface text-lg font-semibold">—</p>
                        <p class="text-on-surface-variant text-sm">Continúa donde lo dejaste</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                    <button id="continue-btn"
                            class="flex-1 sm:flex-none px-6 py-2.5 bg-primary text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                        <!-- login -->
                        <svg class="icon icon-xl" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
                        </svg>
                        Continuar
                    </button>
                    <button id="switch-account-btn"
                            class="flex-1 sm:flex-none px-4 py-2.5 border border-outline-variant text-on-surface-variant rounded-xl font-medium hover:bg-surface transition-all">
                        Usar otra cuenta
                    </button>
                </div>
            </div>
        </div>

        <!-- Mensaje de bienvenida -->
        <div id="welcome-message" class="mt-6 text-center animate-fade-in-up delay-200">
            <h2 class="text-xl md:text-2xl font-semibold text-on-surface">
                Bienvenido a Suit
            </h2>
            <p class="text-on-surface-variant text-sm mt-1">
                Inicia sesión para acceder a tu panel personalizado
            </p>
        </div>

        <!-- Tarjetas decorativas -->
        <div class="mt-8 w-full grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white rounded-xl shadow-sm border border-outline-variant p-5 animate-fade-in-up delay-300">
                <div class="flex items-start gap-3">
                    <!-- receipt -->
                    <svg class="icon icon-3xl text-primary" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M18 17H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20z"/>
                    </svg>
                    <div>
                        <p class="text-on-surface-variant text-[10px] uppercase font-bold tracking-wider">Vales activos</p>
                        <p id="active-vouchers" class="text-2xl font-bold text-on-surface mt-1">--</p>
                        <p class="text-on-surface-variant text-[11px] mt-1">Última actualización: hoy</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-outline-variant p-5 animate-fade-in-up delay-400">
                <div class="flex items-start gap-3">
                    <!-- business -->
                    <svg class="icon icon-3xl text-blue-600" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>
                    </svg>
                    <div>
                        <p class="text-on-surface-variant text-[10px] uppercase font-bold tracking-wider">Proveedores</p>
                        <p id="linked-suppliers" class="text-2xl font-bold text-on-surface mt-1">--</p>
                        <p class="text-on-surface-variant text-[11px] mt-1">Vinculados a tu red</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Botón de login -->
        <button id="go-to-login-btn"
                class="mt-8 w-full md:w-auto px-8 py-3 bg-primary text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 animate-fade-in-up delay-500">
            <!-- login -->
            <svg class="icon icon-xl" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
            </svg>
            Iniciar sesión
        </button>

        <p class="mt-8 text-on-surface-variant text-[10px] text-center animate-fade-in-up delay-600">
            &copy; 2026 Suit · Todos los derechos reservados
        </p>
    </main>

    <script src="/db-manager.js"></script>
    <script src="supabase-client.js"></script>
    <script>
        // ========== ESTADO ==========
        let db = null;
        let redirectTimer = null;

        // ========== INICIALIZACIÓN ==========
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[Lobby] Inicializando...');

            try {
                if (window.suitDB) {
                    db = window.suitDB;
                    try {
                        await db.init();
                        await db.loadInitialData();
                    } catch (e) {
                        console.warn('[Lobby] DB local no disponible:', e);
                    }
                } else {
                    console.warn('[Lobby] suitDB no disponible');
                }

                if (!window.suitSupabase) {
                    console.warn('[Lobby] Supabase no disponible — modo offline');
                }

                // 1. Intentar restaurar sesión automáticamente (solo si hay red)
                const restored = await attemptAutoLogin();
                if (restored) return;

                // 2. Si no se pudo restaurar, mostrar opciones
                const savedAccount = await getSavedAccountFromDB();
                if (savedAccount) {
                    showSavedAccountBanner(savedAccount.email);
                    await loadDashboardStats(savedAccount.role);
                } else {
                    showLoginOption();
                }

                setupEventListeners();

                if (!savedAccount) {
                    redirectTimer = setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 8000);
                }

            } catch (error) {
                console.error('[Lobby] Error:', error);
                showLoginOption();
                setupEventListeners();
            }
        });

        // ========== AUTO-LOGIN CON TOKENS ==========
        async function attemptAutoLogin() {
            if (!window.suitSupabase) return false; // modo offline
            try {
                const { data: { session } } = await window.suitSupabase.auth.getSession();
                if (session) {
                    const profile = await getProfile();
                    if (profile) {
                        redirectToDashboard(profile.role);
                        return true;
                    }
                }

                const tokens = typeof suitGetStoredTokens === 'function'
                    ? await suitGetStoredTokens() : null;
                if (!tokens) return false;

                const { data, error } = await window.suitSupabase.auth.setSession({
                    access_token: tokens.access_token,
                    refresh_token: tokens.refresh_token
                });

                if (error) {
                    if (typeof suitLogout === 'function') await suitLogout();
                    return false;
                }

                if (data.session) {
                    const profile = await getProfile();
                    if (profile) {
                        if (typeof suitPersistSession === 'function') {
                            await suitPersistSession(profile, data.session);
                        }
                        redirectToDashboard(profile.role);
                        return true;
                    }
                }
                return false;
            } catch (err) {
                console.warn('[Lobby] Error en auto-login (posible modo offline):', err);
                return false;
            }
        }

        async function getProfile() {
            if (!window.suitSupabase) return null;
            try {
                const { data, error } = await window.suitSupabase.rpc('get_my_profile');
                if (error) throw error;
                return Array.isArray(data) ? data[0] : data;
            } catch {
                return null;
            }
        }

        // ========== CUENTA GUARDADA ==========
        async function getSavedAccountFromDB() {
            if (!db) return null;
            try {
                const email  = await db.getSetting('userEmail', null);
                const role   = await db.getSetting('userRole', null);
                const expiry = await db.getSetting('sessionExpiry', 0);
                if (!email || !role) return null;
                if (Date.now() > expiry) {
                    if (typeof suitLogout === 'function') await suitLogout();
                    return null;
                }
                return { email, role };
            } catch {
                return null;
            }
        }

        // ========== UI ==========
        function showSavedAccountBanner(email) {
            document.getElementById('saved-email').textContent = email;
            document.getElementById('saved-account-banner').classList.remove('hidden');
            document.getElementById('welcome-message').classList.add('hidden');
            document.getElementById('go-to-login-btn').classList.add('hidden');
        }

        function showLoginOption() {
            document.getElementById('welcome-message').classList.remove('hidden');
            document.getElementById('go-to-login-btn').classList.remove('hidden');
            document.getElementById('saved-account-banner').classList.add('hidden');
        }

        // ========== EVENTOS ==========
        function setupEventListeners() {
            const continueBtn = document.getElementById('continue-btn');
            const switchBtn   = document.getElementById('switch-account-btn');
            const loginBtn    = document.getElementById('go-to-login-btn');

            if (continueBtn) {
                continueBtn.addEventListener('click', () => {
                    attemptAutoLogin().then(success => {
                        if (!success) {
                            const email = document.getElementById('saved-email').textContent;
                            if (email && email !== '—') {
                                window.location.href = `login.html?email=${encodeURIComponent(email)}`;
                            } else {
                                window.location.href = 'login.html';
                            }
                        }
                    });
                });
            }

            if (switchBtn) {
                switchBtn.addEventListener('click', async () => {
                    if (typeof suitLogout === 'function') await suitLogout();
                    window.location.href = 'login.html';
                });
            }

            if (loginBtn) {
                loginBtn.addEventListener('click', () => {
                    window.location.href = 'login.html';
                });
            }
        }

        // ========== REDIRECCIÓN ==========
        // Cuenta nueva sin rol (role null/undefined/'') -> select-role.html.
        // Solo un valor desconocido no vacío cae a login.
        function redirectToDashboard(role) {
            if (role === 'manager')       window.location.replace('home-managers.html');
            else if (role === 'provider') window.location.replace('home-supplier.html');
            else if (!role)               window.location.replace('select-role.html');
            else                          window.location.replace('login.html');
        }

        // ========== STATS (placeholder) ==========
        async function loadDashboardStats(role) {
            const vouchers  = Math.floor(Math.random() * 20) + 5;
            const suppliers = Math.floor(Math.random() * 10) + 1;
            document.getElementById('active-vouchers').textContent  = vouchers;
            document.getElementById('linked-suppliers').textContent = suppliers;
        }

        // ========== LIMPIEZA ==========
        window.addEventListener('beforeunload', () => {
            if (redirectTimer) clearTimeout(redirectTimer);
        });
    </script>
</body>
</html>
