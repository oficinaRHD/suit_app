  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }

      font-family: 'Inter', sans-serif;

<body class="bg-surface min-h-screen flex items-center justify-center p-gutter">
  <main class="w-full max-w-[480px] flex flex-col gap-stack-lg">
    <!-- Header / Logo -->
    <div class="text-center space-y-base">
      <h1 class="font-headline-md text-headline-md text-primary font-black tracking-tight">Suit</h1>
      <p class="font-body-md text-body-md text-on-surface-variant">Recupera el acceso a tu cuenta</p>
    </div>

    <!-- Reset Form Card -->
    <section class="bg-surface-container-lowest border border-outline-variant p-stack-lg rounded-lg login-card-shadow">
      <form class="flex flex-col gap-stack-md" id="resetForm">
        <!-- Mensaje de error o éxito -->
        <div class="hidden p-3 rounded-lg bg-error-container text-on-error-container text-body-sm font-body-sm" id="reset-error"></div>
        <div class="hidden p-3 rounded-lg bg-secondary-container text-on-secondary-container text-body-sm font-body-sm" id="reset-success"></div>

        <!-- Email Field -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-on-surface-variant uppercase" for="email">Correo Electrónico</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
            <input class="w-full pl-10 pr-3 py-3 bg-transparent border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-all outline-none" id="email" name="email" placeholder="nombre@empresa.com" required type="email" />
          </div>
        </div>

        <!-- Submit Button -->
        <button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-title-sm text-title-sm py-3 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2 group disabled:opacity-60 disabled:cursor-not-allowed" id="reset-submit-btn" type="submit">
          <span>Enviar enlace de recuperación</span>
          <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">mail</span>
        </button>
      </form>

      <!-- Link to Login -->
      <div class="mt-stack-lg text-center">
        <a class="text-primary hover:underline font-body-sm" href="login.html">
          <span class="material-symbols-outlined text-sm">arrow_back</span> Volver a Iniciar Sesión
        </a>
      </div>
    </section>

    <!-- Footer Info -->
    <footer class="mt-auto py-stack-md flex flex-col items-center gap-base">
      <div class="flex gap-stack-md">
        <a class="font-body-sm text-body-sm text-outline hover:text-primary transition-colors" href="terms-policy.html">Términos y Privacidad</a>
      </div>
    </footer>
  </main>

  <!-- Background decorative elements -->
  <div class="hidden lg:block fixed -bottom-24 -right-24 w-96 h-96 bg-primary-fixed opacity-20 blur-[100px] rounded-full pointer-events-none"></div>
  <div class="hidden lg:block fixed -top-24 -left-24 w-64 h-64 bg-tertiary-fixed opacity-20 blur-[80px] rounded-full pointer-events-none"></div>

  <!-- Tu archivo supabase-client.js debe estar configurado -->
  <script src="supabase-client.js"></script>
  <script>
    // ====== RESET PASSWORD REQUEST ======
    const resetForm = document.getElementById('resetForm');
    const resetError = document.getElementById('reset-error');
    const resetSuccess = document.getElementById('reset-success');
    const resetSubmitBtn = document.getElementById('reset-submit-btn');

    function showResetError(msg) {
      resetError.textContent = msg;
      resetError.classList.remove('hidden');
      resetSuccess.classList.add('hidden');
    }

    function showResetSuccess(msg) {
      resetSuccess.textContent = msg;
      resetSuccess.classList.remove('hidden');
      resetError.classList.add('hidden');
    }

    function hideMessages() {
      resetError.classList.add('hidden');
      resetSuccess.classList.add('hidden');
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email = document.getElementById('email').value.trim();
      if (!email) {
        showResetError('Ingresa tu correo electrónico.');
        return;
      }

      resetSubmitBtn.disabled = true;

      try {
        // Llamamos a resetPasswordForEmail con la URL de redirección a la página de actualización
        const { error } = await window.suitSupabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/update-password.html'
        });

        if (error) throw error;

        showResetSuccess('Hemos enviado un enlace de recuperación a tu correo. Revisa tu bandeja de entrada (y spam).');
        resetSubmitBtn.disabled = false;
        // Opcional: limpiar campo
        document.getElementById('email').value = '';
      } catch (err) {
        console.error('[Reset Password]', err);
        let msg = err.message || 'Ocurrió un error al enviar el correo. Intenta de nuevo.';
        showResetError(msg);
        resetSubmitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
